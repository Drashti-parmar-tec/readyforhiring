
[project]
name = "readyforhiring-backend"
version = "0.1.0"
description = "AI-powered career development and interview preparation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pydantic-settings",
    "groq",
    "pypdf",
    "python-multipart",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
